# Har push va PR'da: backend testlari (sqlite, tashqi xizmatlarsiz), migratsiya
# tekshiruvi, frontend lint/typecheck/unit testlar (spetsifikatsiya 18, v5: B8).
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      # Sintaksis, aniqlanmagan nom, ishlatilmagan import, import tartibi (audit ARCH-102).
      # Uzun qatorlar (E501) hozircha tekshirilmaydi — alohida tozalanadi.
      - name: Lint (ruff — critical rules)
        run: python -m ruff check apps config realtime tests --select E9,F,I
      - name: Tests
        run: python -m pytest -q
      - name: Production settings deploy check
        env:
          SECRET_KEY: ci-only-${{ github.run_id }}-uR7x9Q2uR7x9Q2uR7x9Q2uR7x9Q2uR7x9Q2uR7x9Q2
          ALLOWED_HOSTS: ci.example.com
          CORS_ALLOWED_ORIGINS: https://ci.example.com
          CSRF_TRUSTED_ORIGINS: https://ci.example.com
          DATABASE_URL: sqlite:///ci-deploy.sqlite3
          REDIS_URL: redis://localhost:6379/0
          TELEGRAM_CREDENTIAL_KEY_VERSION: v1
          TELEGRAM_CREDENTIAL_KEYS: '{"v1": "ci-only-telegram-credential-key-0123456789"}'
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod --tag security
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements/prod.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      # tsc -b + vite build: typecheck o'tsa ham build yiqilishi mumkin (a505c5e)
      - name: Production build
        run: npm run build
      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --audit-level=high
