      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: transaction_type
        schema:
          type: string
          title: Turi
          enum:
          - BANK_DEPOSIT
          - COMPANY_EXPENSE
          - CORRECTION
          - HANDOVER_IN
          - OTHER_IN
          - OTHER_OUT
          - SUPPLIER_PAYMENT
        description: |-
          * `HANDOVER_IN` - Tarqatuvchidan naqd (+)
          * `OTHER_IN` - Boshqa kirim (+)
          * `BANK_DEPOSIT` - Bankka topshirildi (−)
          * `SUPPLIER_PAYMENT` - Yetkazib beruvchiga to'lov (−)
          * `COMPANY_EXPENSE` - Kompaniya xarajati (−)
          * `OTHER_OUT` - Boshqa chiqim (−)
          * `CORRECTION` - Tuzatuvchi yozuv (±)
      tags:
      - cash-transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashTransactionList'
          description: ''
