name: meyfu

# ────────────────────────────────────────────────────────────────────────────
# ISHLAB CHIQARISH (production) bazasi — `config.settings.prod`.
#
#   cp .env.example .env      # → haqiqiy qiymatlar bilan to'ldiring
#   docker compose up -d --build
#
# `prod.py` majburiy o'zgaruvchilar berilmasa (SECRET_KEY, ALLOWED_HOSTS,
# CORS_ALLOWED_ORIGINS, CSRF_TRUSTED_ORIGINS) ishga tushmaydi — bu ataylab
# (audit CFG-001 / SEC-003).
#
# LOKAL ISHLAB CHIQISH uchun dev override'ni qo'shing (dev settings, manba
# bind-mount, ochiq portlar, standart maxfiy qiymatlar):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ────────────────────────────────────────────────────────────────────────────

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  SECRET_KEY: ${SECRET_KEY:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  DATABASE_URL: ${DATABASE_URL:-postgres://meyfu:${POSTGRES_PASSWORD:-meyfu}@db:5432/meyfu}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  POSTGRES_HOST: db
  TIME_ZONE: ${TIME_ZONE:-Asia/Tashkent}
  USE_S3: ${USE_S3:-True}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-meyfu-media}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://minio:9000}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  ADMIN_URL: ${ADMIN_URL:-admin/}
  HEALTH_DETAIL_TOKEN: ${HEALTH_DETAIL_TOKEN:-}
  BACKUP_DIR: ${BACKUP_DIR:-/backups}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-MeyFuBot}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # Birinchi ishga tushirishda superuser yaratish uchun (keyin .env dan olib
  # tashlang). Bo'sh bo'lsa `ensure_superuser` hech narsa qilmaydi.
  DJANGO_SUPERUSER_PHONE: ${DJANGO_SUPERUSER_PHONE:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
  DJANGO_SUPERUSER_NAME: ${DJANGO_SUPERUSER_NAME:-Bosh admin}

x-backend-build: &backend-build
  context: .
  dockerfile: docker/Dockerfile
  args:
    REQUIREMENTS: prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meyfu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meyfu}
      POSTGRES_DB: ${POSTGRES_DB:-meyfu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meyfu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}; do sleep 2; done;
      mc mb -p local/${AWS_STORAGE_BUCKET_NAME:-meyfu-media};
      mc anonymous set download local/${AWS_STORAGE_BUCKET_NAME:-meyfu-media};
      exit 0;
      "

  web:
    build: *backend-build
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build: *backend-build
    command: celery -A config worker -l info
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    volumes:
      - media:/app/media
    depends_on:
      - web
      - redis

  beat:
    build: *backend-build
    command: celery -A config beat -l info
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    depends_on:
      - web
      - redis

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-meyfu}
      PGPASSWORD: ${POSTGRES_PASSWORD:-meyfu}
      PGDATABASE: ${POSTGRES_DB:-meyfu}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/scripts/backup-cron.sh"]
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  miniodata:
  media:
  static:
  backups:
