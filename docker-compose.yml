name: meyfu

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  SECRET_KEY: ${SECRET_KEY:-insecure-dev-key-change-me}
  DEBUG: ${DEBUG:-True}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx}
  DATABASE_URL: postgres://meyfu:meyfu@db:5432/meyfu
  REDIS_URL: redis://redis:6379/0
  POSTGRES_HOST: db
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  USE_S3: ${USE_S3:-True}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-meyfu-media}
  AWS_S3_ENDPOINT_URL: http://minio:9000
  DJANGO_SUPERUSER_PHONE: ${DJANGO_SUPERUSER_PHONE:-+998900000000}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin12345}
  DJANGO_SUPERUSER_NAME: ${DJANGO_SUPERUSER_NAME:-Bosh admin}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meyfu
      POSTGRES_PASSWORD: meyfu
      POSTGRES_DB: meyfu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meyfu"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 2; done;
      mc mb -p local/${AWS_STORAGE_BUCKET_NAME:-meyfu-media};
      mc anonymous set download local/${AWS_STORAGE_BUCKET_NAME:-meyfu-media};
      exit 0;
      "

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    volumes:
      - ./backend:/app
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    command: celery -A config worker -l info
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    volumes:
      - ./backend:/app
      - media:/app/media
    depends_on:
      - web
      - redis

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    command: celery -A config beat -l info
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    volumes:
      - ./backend:/app
    depends_on:
      - web
      - redis

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: meyfu
      PGPASSWORD: meyfu
      PGDATABASE: meyfu
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/scripts/backup-cron.sh"]
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  miniodata:
  media:
  static:
  backups:
